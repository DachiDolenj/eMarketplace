<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <title>ახალი განცხადება - eMarketplace</title>
</head>
<body>
<h1>ახალი განცხადების დამატება</h1>

<form id="newItemForm">
    <label>სახელი: <input type="text" name="name" required></label><br>
    <label>ფასი: <input type="number" name="price" required></label><br>
    <label>აღწერა:<br><textarea name="description" rows="4" cols="50" required></textarea></label><br>
    <label>სურათის ბმული (photoUrl): <input type="url" name="photoUrl" required></label><br>
    <button type="submit">დამატება</button>
</form>

<a href="/index.html">🔙 დაბრუნება მთავარ გვერდზე</a>

<script>
    document.getElementById("newItemForm").addEventListener("submit", async function(e) {
        e.preventDefault();
        const formData = new FormData(e.target);
        const item = Object.fromEntries(formData);

        try {
            const res = await fetch('/market', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(item)
            });

            if (res.ok) {
                alert("განცხადება წარმატებით დაემატა!");
                window.location.href = "/items";
            } else {
                const text = await res.text();
                try {
                    const data = JSON.parse(text);
                    if (data.errors) {
                        const msgs = data.errors.map(err => err.defaultMessage).join('\n');
                        alert("შეცდომა მონაცემებში:\n" + msgs);
                    } else {
                        alert("შეცდომა:\n" + text);
                    }
                } catch (err) {
                    alert("შეცდომა:\n" + text);
                }
            }
        } catch (error) {
            alert("სერვერთან კავშირის შეცდომა!");
        }
    });
</script>
</body>
</html>
