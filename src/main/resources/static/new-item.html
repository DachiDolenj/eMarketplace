<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add New Item - eMarketplace</title>
</head>
<body>
<h1>Add a New Item</h1>

<form id="newItemForm">
    <label>Name: <input type="text" name="name" required></label><br><br>
    <label>Price: <input type="number" name="price" step="0.01" required></label><br><br>
    <label>Description:<br><textarea name="description" rows="4" cols="50" required></textarea></label><br><br>
    <label>Photo URL: <input type="url" name="photoUrl" required></label><br><br>
    <button type="submit">Submit</button>
</form>
<br>
<a href="/items">🔙 Back to items</a>

<script>
    document.getElementById("newItemForm").addEventListener("submit", async function(e) {
        e.preventDefault();
        const formData = new FormData(e.target);
        const item = Object.fromEntries(formData);

        try {
            const res = await fetch('/market', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(item)
            });

            if (res.ok) {
                alert("Item added successfully!");
                window.location.href = "/items";
            } else {
                const text = await res.text();
                try {
                    const data = JSON.parse(text);
                    if (data.errors) {
                        const msgs = data.errors.map(err => err.defaultMessage).join('\n');
                        alert("Data Error:\n" + msgs);
                    } else {
                        alert("Error:\n" + text);
                    }
                } catch (err) {
                    alert("Error:\n" + text);
                }
            }
        } catch (error) {
            alert("Server connection error!");
        }
    });
</script>
</body>
</html>
