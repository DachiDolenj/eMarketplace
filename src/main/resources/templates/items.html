<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <title>eMarketplace - განცხადებები</title>

    <link rel="stylesheet" href="/items.css">

</head>
<body>
    <div id="top-bar">

        <h1 id = "page-title" >ყველა განცხადება</h1>

                <div id = "add-new-item">
                <a id = "add-new-item-text" href="/new-item.html">➕ დაამატე ახალი განცხადება</a>
                </div>

        <a href="/login" id="user-info">Loading...</a>
    </div>

    <div id="items-container"></div>

    <div id="pagination"></div>


    <script>
        fetch('/market?page=0')
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById("items-container");
                data.items.forEach(item => {
                    const div = document.createElement("div");
                    div.innerHTML = `
                        <h3><a href="/item/${item.id}">${item.name}</a></h3>
                        <p>ფასი: ${item.price}₾</p>
                        <p>${item.description.substring(0, 100)}...</p>
                        <img src="${item.photoUrl}" alt="${item.name}" width="200">
                        <br><br>
                        <button onclick="deleteItem(${item.id})" style="background-color: red; color: white; border: none; padding: 5px 10px; cursor: pointer; border-radius: 5px;">🗑 წაშლა</button>
                        <hr>
                    `;
                    container.appendChild(div);
                });
            });

        fetch('/api/user')
            .then(res => {
                if (res.status === 200) {
                    return res.json();
                } else {
                    throw new Error("Not logged in");
                }
            })
            .then(user => {
                const userInfo = document.getElementById("user-info");
                userInfo.innerHTML = `მომხმარებელი: ${user.username} <span id="logout-btn">log out</span>`;

                document.getElementById("logout-btn").addEventListener("click", () => {
                    fetch('/logout', { method: 'POST' })
                        .then(() => location.reload());
                });
            })
            .catch(() => {
                document.getElementById("user-info").innerText = "მომხმარებელი არ არის შესული";
            });

        function deleteItem(id) {
            if (!confirm("ნამდვილად გსურთ ამ განცხადების წაშლა? (Are you sure?)")) {
                return;
            }

            fetch(`/market/${id}`, {
                method: 'DELETE'
            })
            .then(async res => {
                if (res.ok) {
                    alert("განცხადება წაიშალა! (Item deleted)");
                    location.reload(); // Refresh the page to show the updated list
                } else {
                    const msg = await res.text();
                    alert("შეცდომა: " + msg);
                }
            });
        }
    </script>
</body>
</html>
